<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detection • ResNet-50 AI Forensics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070b14;
            color: #f8fafc;
        }
        @media print {
            body {
                background-color: #ffffff !important;
                color: #0f172a !important;
            }
            nav, footer, .print\:hidden {
                display: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#070b14] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Navbar -->
    <nav class="bg-[#070b14]/85 backdrop-blur-xl border-b border-slate-800/80 text-white sticky top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <a href="{{ url_for('index') }}" class="flex-shrink-0 flex items-center gap-2.5 font-black text-xl tracking-wide group">
                    <div class="w-9 h-9 bg-gradient-to-tr from-indigo-600 to-cyan-400 rounded-xl flex items-center justify-center shadow-[0_0_20px_rgba(79,70,229,0.5)] group-hover:scale-105 transition-transform">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    </div>
                    <span class="text-white group-hover:text-cyan-300 transition-colors font-mono tracking-tight">
                        Deepfake<span class="text-cyan-400 font-extrabold">.AI</span>
                    </span>
                </a>
                
                <!-- Links -->
                <div class="hidden md:block">
                    <div class="ml-10 flex items-center space-x-2">
                        <a href="{{ url_for('index') }}" class="px-4 py-2 rounded-xl text-xs font-semibold tracking-wide transition-all {% if request.endpoint == 'index' %}bg-indigo-600/20 text-cyan-300 border border-indigo-500/30 shadow-[0_0_15px_rgba(79,70,229,0.25)]{% else %}text-slate-400 hover:text-white hover:bg-slate-900{% endif %}">Beranda</a>
                        <a href="{{ url_for('detect') }}" class="px-4 py-2 rounded-xl text-xs font-semibold tracking-wide transition-all {% if request.endpoint == 'detect' %}bg-indigo-600/20 text-cyan-300 border border-indigo-500/30 shadow-[0_0_15px_rgba(79,70,229,0.25)]{% else %}text-slate-400 hover:text-white hover:bg-slate-900{% endif %}">Uji Forensik</a>
                        <a href="{{ url_for('history') }}" class="px-4 py-2 rounded-xl text-xs font-semibold tracking-wide transition-all {% if request.endpoint == 'history' %}bg-indigo-600/20 text-cyan-300 border border-indigo-500/30 shadow-[0_0_15px_rgba(79,70,229,0.25)]{% else %}text-slate-400 hover:text-white hover:bg-slate-900{% endif %}">Riwayat Arsip</a>
                    </div>
                </div>

                <!-- Live Indicator Pill -->
                <div class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900/80 border border-slate-800 text-[11px] font-mono text-slate-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>ResNet-50 Transfer Learning Active</span>
                </div>

                <!-- Mobile Menu Button -->
                <div class="-mr-2 flex md:hidden">
                    <button type="button" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="p-2 rounded-xl text-slate-400 hover:text-white bg-slate-900 border border-slate-800 focus:outline-none">
                        <svg class="block h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Dropdown -->
        <div class="md:hidden hidden bg-[#070b14] border-t border-slate-800/80" id="mobile-menu">
            <div class="px-4 pt-3 pb-4 space-y-1">
                <a href="{{ url_for('index') }}" class="block px-3 py-2 rounded-xl text-sm font-semibold {% if request.endpoint == 'index' %}bg-indigo-600 text-white{% else %}text-slate-400 hover:text-white{% endif %}">Beranda</a>
                <a href="{{ url_for('detect') }}" class="block px-3 py-2 rounded-xl text-sm font-semibold {% if request.endpoint == 'detect' %}bg-indigo-600 text-white{% else %}text-slate-400 hover:text-white{% endif %}">Uji Forensik</a>
                <a href="{{ url_for('history') }}" class="block px-3 py-2 rounded-xl text-sm font-semibold {% if request.endpoint == 'history' %}bg-indigo-600 text-white{% else %}text-slate-400 hover:text-white{% endif %}">Riwayat Arsip</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-[#070b14] border-t border-slate-800/80 mt-auto print:hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="md:flex md:items-center md:justify-between text-center md:text-left">
                <div class="flex justify-center md:justify-start mb-4 md:mb-0 items-center gap-2 font-bold text-base tracking-wide text-slate-300">
                    <div class="w-6 h-6 bg-gradient-to-tr from-indigo-600 to-cyan-400 rounded-lg flex items-center justify-center">
                        <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    </div>
                    Deepfake<span class="text-cyan-400 font-normal">.AI</span> Forensics
                </div>
                <div class="text-xs text-slate-500 font-mono">
                    Implementasi Deep Learning ResNet-50 Transfer Learning • FFHQ & FaceForensics++ Pipeline
                </div>
            </div>
        </div>
    </footer>
    
    {% block scripts %}{% endblock %}
</body>
</html>
